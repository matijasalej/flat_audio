[package]
name = "wholeflat_native"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Whole Flat Audio native core: librespot (Spotify Connect) behind JNI"

[lib]
name = "wholeflat_native"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
log = "0.4"
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }

# librespot, dev head of 21 Oct 2026. The crates.io 0.8.0 release does not build, so the sub-crates
# come straight from git at one pinned revision. default-features = false drops native-tls
# (OpenSSL, painful on the NDK) and the stock rodio/cpal audio backend: audio leaves through our own
# `Sink` (src/ring.rs) and is played by android.media.AudioTrack on the Kotlin side. TLS is rustls with
# the compiled-in webpki roots (no host certificate store), zeroconf is the pure-Rust libmdns.
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "99b6088bf3ea028f90192676ac1a337fa4b2ed12", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "99b6088bf3ea028f90192676ac1a337fa4b2ed12", default-features = false }
librespot-discovery = { git = "https://github.com/librespot-org/librespot", rev = "99b6088bf3ea028f90192676ac1a337fa4b2ed12", default-features = false, features = ["with-libmdns"] }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "99b6088bf3ea028f90192676ac1a337fa4b2ed12", default-features = false }

# Logging to logcat exists on Android only; the host build (cargo check / cargo test) has no logger.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"

# A Connect receiver replays the credential a controller hands over in the zeroconf blob, and Spotify
# only honours it under the client id that issued it. Desktop controllers use the desktop (keymaster)
# id, so the receiver pins that id (see src/engine.rs). Upstream librespot-core still mints the client
# token and announces the platform from the host OS, i.e. as Android on this build, and login5 turns
# down a request whose client token was issued to another client id. The vendored copy fixes that in
# three places (client token, user agent, claimed version), the same change Rusty carries
# (https://github.com/SerafiniJose/rusty). See the header of vendor/librespot-core/Cargo.toml.
[patch."https://github.com/librespot-org/librespot"]
librespot-core = { path = "vendor/librespot-core" }

# `strip = "symbols"` drops .symtab/.strtab only, the dynamic symbol table survives, so JNI method
# resolution is unaffected. `panic` stays at the default `unwind`: tokio turns a panicking task into
# a JoinError, and the JNI entry points catch panics instead of letting them cross into the JVM.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
