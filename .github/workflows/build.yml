name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch replaces a build that is still running (never on main: a
# running release build is not cancelled).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Gradle is pinned because there is no wrapper jar in the repository. AGP 9.4 needs 9.6.0 or newer.
  GRADLE_VERSION: "9.6.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          rustc --version
          cargo --version

      # The compiled dependencies are cached even when the build of our own crate fails.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Check the NDK
        run: |
          # The image has NDK 27.3 as ANDROID_NDK_HOME and 30 as ANDROID_NDK_LATEST_HOME; 27 is the one wanted.
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          revision=$(sed -n 's/^Pkg.Revision *= *//p' "$ANDROID_NDK_HOME/source.properties")
          echo "NDK revision: $revision"
          case "$revision" in
            27.*) ;;
            *) echo "::error::expected NDK 27, got $revision"; exit 1 ;;
          esac
          cargo ndk --version

      - name: Check that the vendored librespot-core is the one in use
        working-directory: native
        run: |
          cargo tree --target aarch64-linux-android -p librespot-core --depth 0 | tee tree.txt
          grep -q 'native/vendor/librespot-core' tree.txt || { echo "::error::the [patch] for librespot-core is not applied"; exit 1; }

      - name: Build the native core
        working-directory: native
        run: cargo ndk -t armeabi-v7a -t arm64-v8a -P 26 -o ../app/src/main/jniLibs build --release

      - name: Native libraries
        run: ls -l app/src/main/jniLibs/*/

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Decode the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 is not set, the release will be signed with the debug key"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12"
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build the release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify the APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          ls -l "$apk"
          buildtools=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          echo "build-tools $buildtools"
          "$ANDROID_HOME/build-tools/$buildtools/apksigner" verify --verbose --print-certs "$apk"
          listing=$(unzip -l "$apk")
          for abi in arm64-v8a armeabi-v7a; do
            echo "$listing" | grep -q "lib/$abi/libwholeflat_native.so" || { echo "::error::lib/$abi/libwholeflat_native.so is missing from the APK"; exit 1; }
          done
          echo "$listing" | grep 'libwholeflat_native.so'

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk WholeFlatAudio.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: WholeFlatAudio
          path: WholeFlatAudio.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Cargo.lock
          path: native/Cargo.lock
          if-no-files-found: ignore

      - name: Publish a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" WholeFlatAudio.apk --title "Build ${GITHUB_RUN_NUMBER}" --notes "Commit ${GITHUB_SHA}" --latest
