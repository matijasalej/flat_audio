<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Whole Flat">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="/remote/manifest.webmanifest">
<link rel="apple-touch-icon" href="/remote/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/remote/icon-192.png">
<title>Whole Flat</title>
<style>
  :root {
    --bg: #0f1720;
    --card: #1a2430;
    --card-hi: #243140;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #1b6ef3;
    --accent-dim: #2a4f8f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.35 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 6px 0 16px; }
  .notice { background: #4a2b12; color: #ffd166; border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; font-size: 15px; }
  .choices { display: grid; gap: 12px; }
  .choice {
    appearance: none; border: 0; text-align: left; color: var(--text); background: var(--card);
    border-radius: 16px; padding: 16px 18px; min-height: 84px; font: inherit; cursor: pointer;
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
    transition: background .15s;
  }
  .choice:active { background: var(--card-hi); }
  .choice .name { font-size: 21px; font-weight: 650; }
  .choice .what { grid-column: 1; font-size: 15px; color: var(--muted); }
  .choice .tick { grid-row: 1 / span 2; grid-column: 2; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #3a4a5c; }
  .choice[aria-pressed="true"] { background: var(--accent); }
  .choice[aria-pressed="true"] .what { color: #dbe8ff; }
  .choice[aria-pressed="true"] .tick { border-color: #fff; background: #fff; box-shadow: inset 0 0 0 7px var(--accent); }
  #status { color: var(--muted); font-size: 14px; margin: 12px 4px 0; min-height: 1.35em; }
  .volume { margin-top: 34px; }
  .volume .head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 10px; }
  .volume .head span:first-child { font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  #value { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .row { display: grid; grid-template-columns: 64px 1fr 64px; gap: 12px; align-items: center; }
  .step {
    appearance: none; border: 0; border-radius: 16px; background: var(--card); color: var(--text);
    height: 64px; font-size: 32px; line-height: 1; cursor: pointer;
  }
  .step:active { background: var(--card-hi); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 64px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: #33414f; }
  input[type=range]::-moz-range-track { height: 10px; border-radius: 5px; background: #33414f; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 40px; border-radius: 50%; background: #fff; margin-top: -15px; box-shadow: 0 2px 8px #0008; }
  input[type=range]::-moz-range-thumb { width: 40px; height: 40px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px #0008; }
  .offline #status { color: #ffd166; }
  .lights { margin-top: 30px; }
  .lights .head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 10px; color: var(--muted); font-size: 15px; }
  .lights .head span:first-child { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .pair { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .colour { appearance: none; border: 0; border-radius: 16px; background: var(--card); color: var(--text); font: inherit; font-size: 17px; font-weight: 600; height: 56px; }
  .colour:active { background: var(--card-hi); }
  .switch { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; background: var(--card); border-radius: 16px; padding: 16px 18px; margin: 0 0 14px; }
  .switch .name { font-size: 21px; font-weight: 650; }
  .switch .what { grid-column: 1; font-size: 15px; color: var(--muted); }
  .toggle { grid-row: 1 / span 2; grid-column: 2; appearance: none; border: 0; width: 64px; height: 36px; border-radius: 18px; background: #3a4a5c; position: relative; cursor: pointer; transition: background .15s; }
  .toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff; transition: left .15s; }
  .toggle[aria-checked="true"] { background: var(--accent); }
  .toggle[aria-checked="true"]::after { left: 32px; }
  .toggle[aria-busy="true"] { opacity: .6; }
  .section { margin-top: 30px; }
  .section .head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 10px; }
  .section .head span:first-child { font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .section .head span:last-child { font-variant-numeric: tabular-nums; }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
  .swatch { appearance: none; border: 3px solid transparent; border-radius: 14px; height: 52px; font: inherit; font-size: 13px; font-weight: 600; color: #111a; cursor: pointer; }
  .swatch[aria-pressed="true"] { border-color: #fff; }
  .label { font-size: 14px; color: var(--muted); margin: 4px 4px 0; }
  #hue::-webkit-slider-runnable-track { background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  #hue::-moz-range-track { background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .switch.pulse { margin: 18px 0 0; }
  .switch.pulse .name { font-size: 18px; }
  .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin: -6px 4px 0; }
</style>
</head>
<body>
<main id="app">
  <h1>Whole Flat</h1>
  <div id="notice" class="notice" hidden>The TV is showing the Spotify app. Pick a setting to take it back.</div>
  <div class="switch">
    <span class="name">Synced on HDMI</span>
    <button class="toggle" id="replay" role="switch" aria-checked="false" aria-label="Synced on HDMI"></button>
    <span class="what" id="replayText">&ndash;</span>
  </div>
  <div class="choices" role="group" aria-label="What the TV shows">
    <button class="choice" data-display="listen" aria-pressed="false">
      <span class="name">Listening</span><span class="tick"></span>
      <span class="what">Screen off, lights off</span>
    </button>
    <button class="choice" data-display="chill" aria-pressed="false">
      <span class="name">Chill</span><span class="tick"></span>
      <span class="what">Screen off, one colour of your choice</span>
    </button>
    <button class="choice" data-display="party" aria-pressed="false">
      <span class="name">Party</span><span class="tick"></span>
      <span class="what">Screen off, lights follow the song</span>
    </button>
    <button class="choice" data-display="karaoke" aria-pressed="false">
      <span class="name">Karaoke</span><span class="tick"></span>
      <span class="what">Screen on with the lyrics, lights follow the song</span>
    </button>
  </div>
  <div id="status"></div>

  <section class="section" id="chill" aria-label="Chill colour" hidden>
    <div class="head"><span>Colour</span><span id="chillNow">&ndash;</span></div>
    <div class="swatches" id="swatches"></div>
    <input type="range" id="hue" min="0" max="359" step="1" value="30" aria-label="Your own colour">
    <div class="label">Your own colour</div>
    <input type="range" id="level" min="10" max="100" step="5" value="80" aria-label="Brightness">
    <div class="ends"><span>Dim</span><span>Bright</span></div>
    <div class="switch pulse">
      <span class="name">Slow pulse</span>
      <button class="toggle" id="pulse" role="switch" aria-checked="false" aria-label="Slow pulse"></button>
      <span class="what">The colour fades slowly brighter and dimmer</span>
    </div>
  </section>

  <section class="volume" aria-label="Kitchen volume">
    <div class="head"><span>Kitchen volume</span><span id="value">&ndash;</span></div>
    <div class="row">
      <button class="step" id="down" aria-label="Quieter">&minus;</button>
      <input type="range" id="slider" min="0" max="100" step="1" value="0" aria-label="Kitchen volume">
      <button class="step" id="up" aria-label="Louder">+</button>
    </div>
  </section>

  <section class="section" aria-label="Kitchen timing">
    <div class="head"><span>Kitchen timing</span><span id="fineNow">&ndash;</span></div>
    <input type="range" id="fine" min="-300" max="300" step="5" value="0" aria-label="Kitchen earlier or later">
    <div class="ends"><span>Kitchen earlier</span><span>Kitchen later</span></div>
  </section>

  <section class="lights" id="lights" aria-label="Lights" hidden>
    <div class="head"><span>Lights</span><span id="lightsNow">&ndash;</span></div>
    <div class="pair">
      <button class="colour" data-step="less">Less colour</button>
      <button class="colour" data-step="keep">Just right</button>
      <button class="colour" data-step="more">More colour</button>
    </div>
  </section>
</main>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var slider = $('#slider'), value = $('#value'), status = $('#status'), notice = $('#notice');
  var lightsBox = $('#lights'), lightsNow = $('#lightsNow');
  var CLASS = { mono: 'Mono', duo: 'Duo', multi: 'Multi' };
  var LOOK = { calm: 'drifting', lively: 'lively', party: 'Party', rhythm: 'Rhythm', scanner: 'Scanner', 'scanner-cw': 'Scanner', vu: 'VU meter', spectrum: 'Spectrum', colora: 'Colora' };
  var dragging = false, lastVolumeSent = 0, online = true;
  var replayBtn = $('#replay'), replayText = $('#replayText'), chill = $('#chill'), chillNow = $('#chillNow'), swatches = $('#swatches');
  var hue = $('#hue'), level = $('#level'), fine = $('#fine'), fineNow = $('#fineNow');
  var touching = { hue: false, level: false, fine: false }, lastLightSent = 0, moodsShown = '';

  function get(path) {
    return fetch(path, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function say(s) {
    var parts = [];
    if (s.tv_text) parts.push(s.tv_text);
    if (s.kitchen_text) parts.push(s.kitchen_text);
    status.textContent = online ? parts.join(' · ') : 'No connection to the box';
    document.body.classList.toggle('offline', !online);
  }

  function render(s) {
    online = true;
    var lyrics = s.mode === 'lyrics';
    if (s.warning) {
      // the TV's player is stuck: that is said first, in the notice, whatever the mode
      notice.textContent = s.warning;
      notice.hidden = false;
    } else {
      notice.textContent = 'The TV is showing the Spotify app. Pick a setting to take it back.';
      notice.hidden = !lyrics;
    }
    document.querySelectorAll('.choice').forEach(function (b) {
      b.setAttribute('aria-pressed', String(!lyrics && b.dataset.display === s.display));
    });
    if (!dragging && typeof s.volume === 'number') {
      slider.value = s.volume;
      value.textContent = s.volume;
    } else if (typeof s.volume !== 'number' && !dragging) {
      value.innerHTML = '&ndash;';
    }
    var r = s.replay || {};
    replayBtn.setAttribute('aria-checked', String(r.pending != null ? r.pending : r.on === true));
    replayBtn.setAttribute('aria-busy', String(r.pending != null));
    replayText.textContent = r.text || '\u2013';
    chill.hidden = lyrics || s.display !== 'chill';
    renderMoods(s);
    if (!touching.level && typeof s.light_level === 'number') level.value = s.light_level;
    $('#pulse').setAttribute('aria-checked', String(s.light_pulse === true));
    if (!touching.fine && typeof s.kitchen_offset_ms === 'number') { fine.value = s.kitchen_offset_ms; fineNow.textContent = fineText(s.kitchen_offset_ms); }
    var l = s.lights;
    lightsBox.hidden = !(l && l.on);
    if (l && l.on) lightsNow.textContent = (CLASS[l['class']] || l['class']) + (l.override ? ' (yours)' : '') + (l.tv ? ' \u00b7 ' + (LOOK[l.tv] || l.tv) : '') + (l.bpm ? ' \u00b7 ' + l.bpm + ' BPM' : '');
    say(s);
  }

  function fineText(ms) {
    ms = Number(ms);
    return ms === 0 ? 'in step' : (Math.abs(ms) + ' ms ' + (ms > 0 ? 'later' : 'earlier'));
  }

  function hex(h) {
    // the hue at full colour, as #rrggbb
    var f = function (n) { var k = (n + h / 60) % 6; return Math.round(255 * (1 - Math.max(0, Math.min(k, 4 - k, 1)))); };
    return '#' + [f(5), f(3), f(1)].map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('');
  }

  function renderMoods(s) {
    var moods = s.moods || [];
    var key = JSON.stringify(moods);
    if (key !== moodsShown) {
      moodsShown = key;
      swatches.innerHTML = '';
      moods.forEach(function (m) {
        var b = document.createElement('button');
        b.className = 'swatch';
        b.style.background = m.color;
        b.textContent = m.label;
        b.dataset.color = m.color;
        b.addEventListener('click', function () { sendLight('color=' + encodeURIComponent(m.color)); });
        swatches.appendChild(b);
      });
    }
    var own = true;
    swatches.querySelectorAll('.swatch').forEach(function (b) {
      var on = b.dataset.color === s.light_color;
      if (on) { own = false; chillNow.textContent = b.textContent; }
      b.setAttribute('aria-pressed', String(on));
    });
    if (own && s.light_color) chillNow.textContent = 'Your own';
  }

  function sendLight(arg) {
    return get('/remote/action?' + arg).then(render).catch(function () { online = false; say({}); });
  }

  function poll() {
    get('/remote/state.json').then(render).catch(function () { online = false; say({}); });
  }

  document.querySelectorAll('.choice').forEach(function (b) {
    b.addEventListener('click', function () {
      // the answer is the new state: the button changes at once
      document.querySelectorAll('.choice').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      notice.hidden = true;
      get('/remote/action?display=' + encodeURIComponent(b.dataset.display)).then(render).catch(function () { online = false; say({}); });
    });
  });

  document.querySelectorAll('.colour').forEach(function (b) {
    b.addEventListener('click', function () {
      get('/lights/colour?step=' + b.dataset.step).then(poll).catch(function () { online = false; say({}); });
    });
  });

  function sendVolume(arg) {
    return get('/remote/action?volume=' + encodeURIComponent(arg)).then(render).catch(function () { online = false; say({}); });
  }

  replayBtn.addEventListener('click', function () {
    var on = replayBtn.getAttribute('aria-checked') !== 'true';
    replayBtn.setAttribute('aria-checked', String(on));
    replayBtn.setAttribute('aria-busy', 'true');
    get('/remote/action?replay=' + (on ? 'on' : 'off')).then(render).catch(function () { online = false; say({}); });
  });

  // the TV takes a new colour at most twice a second
  function throttled(input, name, arg) {
    input.addEventListener('input', function () {
      touching[name] = true;
      var now = Date.now();
      if (now - lastLightSent > 500) { lastLightSent = now; sendLight(arg()); }
    });
    input.addEventListener('change', function () {
      lastLightSent = Date.now();
      sendLight(arg()).then(function () { touching[name] = false; });
    });
  }
  $('#pulse').addEventListener('click', function () {
    var on = this.getAttribute('aria-checked') !== 'true';
    this.setAttribute('aria-checked', String(on));
    sendLight('pulse=' + (on ? 'on' : 'off'));
  });
  throttled(hue, 'hue', function () { return 'color=' + encodeURIComponent(hex(Number(hue.value))); });
  throttled(level, 'level', function () { return 'level=' + level.value; });

  // the kitchen moves when the finger is lifted: each change shifts it at once
  fine.addEventListener('input', function () { touching.fine = true; fineNow.textContent = fineText(fine.value); });
  fine.addEventListener('change', function () {
    sendLight('fine_ms=' + encodeURIComponent(fine.value)).then(function () { touching.fine = false; });
  });

  slider.addEventListener('input', function () {
    dragging = true;
    value.textContent = slider.value;
    var now = Date.now();
    // while the finger is down the volume follows, not more than five times a second
    if (now - lastVolumeSent > 200) {
      lastVolumeSent = now;
      sendVolume(slider.value);
    }
  });
  slider.addEventListener('change', function () {
    lastVolumeSent = Date.now();
    sendVolume(slider.value).then(function () { dragging = false; });
  });
  $('#down').addEventListener('click', function () { dragging = false; sendVolume('-'); });
  $('#up').addEventListener('click', function () { dragging = false; sendVolume('+'); });

  poll();
  setInterval(poll, 1500);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
